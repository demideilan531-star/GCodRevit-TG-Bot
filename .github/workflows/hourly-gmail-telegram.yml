name: Gmail Report On Demand

on:
  workflow_dispatch:
    inputs:
      notify_chat_id:
        description: "Telegram chat_id that receives the report and completion notification"
        required: false
        default: "1839693017"
        type: string

permissions:
  contents: write

concurrency:
  group: gmail-report
  cancel-in-progress: false

jobs:
  gmail-report:
    uses: ./.github/workflows/gmail-report-core.yml
    with:
      report_chat_id: ${{ inputs.notify_chat_id }}
      notify_completion: true
    secrets: inherit
