name: Gmail Report Schedule (Disabled)

on:
  # Automatic Gmail reports are disabled. The Telegram button uses
  # hourly-gmail-telegram.yml and remains available independently.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gmail-report
  cancel-in-progress: false

jobs:
  gmail-report:
    uses: ./.github/workflows/gmail-report-core.yml
    with:
      report_chat_id: "1839693017"
      notify_completion: false
    secrets: inherit

