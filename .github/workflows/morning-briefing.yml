name: Personal Morning Briefing

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Opaque private briefing request ID"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: morning-briefing-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  build-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image renderer
        run: python -m pip install --quiet pillow
      - name: Build and deliver private briefing
        env:
          BRIEFING_REQUEST_ID: ${{ inputs.request_id }}
          GMAIL_BROKER_URL: ${{ vars.GMAIL_BROKER_URL }}
          GMAIL_BROKER_TOKEN: ${{ secrets.GMAIL_BROKER_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scripts/morning_briefing.py
