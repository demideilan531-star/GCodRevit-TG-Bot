name: Telegram Account Context Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read
  id-token: write

concurrency:
  group: telegram-account-context-sync
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      vars.TELEGRAM_CONTEXT_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned MTProto client
        run: python -m pip install --disable-pip-version-check -r scripts/telegram-account-requirements.txt
      - name: Synchronize private account context
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_USER_SESSION: ${{ secrets.TELEGRAM_USER_SESSION }}
          TELEGRAM_ACCOUNT_OWNER_ID: ${{ secrets.TELEGRAM_ACCOUNT_OWNER_ID }}
          TELEGRAM_CONTEXT_BROKER_URL: ${{ vars.TELEGRAM_CONTEXT_BROKER_URL }}
          TELEGRAM_CONTEXT_OIDC_AUDIENCE: ${{ vars.TELEGRAM_CONTEXT_OIDC_AUDIENCE }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python scripts/telegram_account_sync.py
