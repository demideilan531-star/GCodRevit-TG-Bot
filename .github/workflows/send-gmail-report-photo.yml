name: Send Gmail Report Photo

on:
  push:
    branches: [main]
    paths:
      - "reports/latest.txt"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  statuses: write

concurrency:
  group: gmail-report-photo
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Gmail report image and caption
        run: |
          python -m pip install --quiet pillow
          cat > /tmp/make_report.py <<'PY'
          import re
          from pathlib import Path
          from textwrap import wrap
          from PIL import Image, ImageDraw, ImageFont

          report = Path('reports/latest.txt').read_text(encoding='utf-8').strip()
          if not report:
              raise SystemExit('reports/latest.txt is empty')

          def get(pattern, default='0'):
              m = re.search(pattern, report, re.I | re.M)
              return m.group(1).strip() if m else default

          checked = get(r'^Проверка Gmail:\s*(.+)$', 'Время не указано')
          period = get(r'^(?:Период|Проверенный период):\s*(.+)$', 'Последние 24 часа')
          new = get(r'^Новых писем(?:[^:]*):\s*(\d+)', '0')
          urgent = get(r'^Срочные/технические письма:\s*(\d+)', '0')
          work = get(r'^Ответы по работе/уч[её]бе:\s*(\d+)', '0')
          invites = get(r'^Приглашения:\s*(\d+)', '0')
          finance = get(r'^Финансовые вопросы:\s*(\d+)', '0')
          security = get(r'^Угрозы безопасности:\s*(\d+)', '0')
          one_time = get(r'^Одноразовые письма:\s*(\d+)', '0')

          W, H = 1080, 1350
          img = Image.new('RGB', (W, H), '#07111f')
          d = ImageDraw.Draw(img)
          regular_path = '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          bold_path = '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          regular = lambda n: ImageFont.truetype(regular_path, n)
          bold = lambda n: ImageFont.truetype(bold_path, n)

          for y in range(H):
              t = y / H
              d.line((0, y, W, y), fill=(7 + int(8*t), 17 + int(20*t), 31 + int(32*t)))

          d.rectangle((0, 0, W, 230), fill='#091727')
          for x, h in [(20,90),(120,160),(225,120),(330,190),(450,145),(570,205),(700,130),(810,180),(930,150)]:
              d.rectangle((x, 230-h, x+78, 230), fill='#0d2237')

          d.rounded_rectangle((45, 38, 1035, 188), 28, fill='#10253b', outline='#2b83df', width=3)
          d.text((78, 58), 'ОТЧЁТ ПО GMAIL', font=bold(62), fill='white')
          d.text((80, 137), checked, font=regular(27), fill='#b4d1ec')

          d.rounded_rectangle((45, 215, 1035, 315), 24, fill='#0c1d30', outline='#2d4a63', width=2)
          d.text((74, 235), 'ПЕРИОД', font=bold(25), fill='#72b8f3')
          d.text((74, 270), wrap(period, 65)[0], font=regular(24), fill='white')

          accent = '#ff626b' if int(security) else '#54a8ff'
          headline = 'НУЖНО ПРОВЕРИТЬ' if int(security) else ('ЕСТЬ НОВЫЕ ПИСЬМА' if int(new) else 'ВСЁ СПОКОЙНО')
          summary = f'Угроз безопасности: {security}' if int(security) else (f'Получено новых писем: {new}' if int(new) else 'Новых писем нет')

          d.rounded_rectangle((45, 345, 485, 610), 28, fill='#0d3151', outline='#3c9cf4', width=3)
          d.text((78, 378), 'НОВЫХ ПИСЕМ', font=bold(30), fill='#8acaff')
          d.text((78, 432), new, font=bold(115), fill='white')

          d.rounded_rectangle((515, 345, 1035, 610), 28, fill='#12263a', outline=accent, width=3)
          d.text((548, 378), headline, font=bold(31), fill=accent)
          y = 438
          for line in wrap(summary, 30):
              d.text((548, y), line, font=regular(29), fill='white')
              y += 42

          rows = [
              ('СРОЧНЫЕ / ТЕХНИЧЕСКИЕ', urgent, '#ff626b'),
              ('РАБОТА / УЧЁБА', work, '#4e9fff'),
              ('ПРИГЛАШЕНИЯ', invites, '#a979ff'),
              ('ФИНАНСОВЫЕ ВОПРОСЫ', finance, '#f3c84a'),
              ('УГРОЗЫ БЕЗОПАСНОСТИ', security, '#ff626b' if int(security) else '#54d98c'),
          ]
          y = 650
          for label, value, color in rows:
              d.rounded_rectangle((45, y, 1035, y+92), 22, fill='#0c1e31', outline='#294762', width=2)
              d.ellipse((76, y+27, 112, y+63), fill=color)
              d.text((137, y+25), label, font=bold(27), fill='white')
              d.text((950, y+20), value, font=bold(42), fill=color, anchor='ra')
              y += 105

          d.rounded_rectangle((45, 1185, 1035, 1275), 22, fill='#0e2a3c', outline='#45a7d5', width=2)
          d.text((78, 1208), 'ОДНОРАЗОВЫЕ ПИСЬМА', font=bold(27), fill='#8dd9ff')
          d.text((950, 1202), one_time, font=bold(42), fill='white', anchor='ra')
          d.text((50, 1305), 'GMAIL MONITOR BOT · личный отчёт', font=regular(22), fill='#7698b6')
          img.save('/tmp/gmail_report.png', optimize=True)

          caption = report
          if len(caption) > 1024:
              caption = (
                  f'📬 Отчёт по Gmail\n\nПроверка: {checked}\nПериод: {period}\n'
                  f'Новых писем: {new}\n\nСрочные/технические: {urgent}\n'
                  f'Работа/учёба: {work}\nПриглашения: {invites}\nФинансы: {finance}\n'
                  f'Угрозы безопасности: {security}\nОдноразовые письма: {one_time}\n\n{summary}'
              )
          Path('/tmp/gmail_caption.txt').write_text(caption, encoding='utf-8')
          PY
          python /tmp/make_report.py

      - name: Send report to private Telegram chat and verify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_PRIVATE_CHAT_ID: ${{ secrets.TELEGRAM_PRIVATE_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
          DEFAULT_PRIVATE_CHAT_ID: "1839693017"
        run: |
          set -u
          chat_id="${TELEGRAM_PRIVATE_CHAT_ID:-${DEFAULT_PRIVATE_CHAT_ID}}"
          state=failure
          description="Telegram publication failed"
          comment="❌ Gmail-отчёт не опубликован: неизвестная ошибка"
          result=1

          fail() {
            description="$1"
            comment="❌ Gmail-отчёт не опубликован: $1"
          }

          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "$chat_id" ]; then
            fail "не настроен токен бота или ID личного чата"
          else
            chat_response=$(curl --silent --show-error --request POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getChat" \
              --data-urlencode "chat_id=${chat_id}" 2>&1)
            chat_ok=$(printf '%s' "$chat_response" | python -c 'import json,sys; d=json.load(sys.stdin); print(str(d.get("ok",False)).lower())' 2>/dev/null || printf false)
            chat_type=$(printf '%s' "$chat_response" | python -c 'import json,sys; d=json.load(sys.stdin); print(d.get("result",{}).get("type",""))' 2>/dev/null || true)

            if [ "$chat_ok" != "true" ]; then
              fail "Telegram не смог открыть настроенный личный чат"
            elif [ "$chat_type" != "private" ]; then
              fail "настроенный адрес Telegram не является личным чатом; отправка в канал или группу заблокирована"
            else
              response=$(curl --silent --show-error --request POST \
                "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto" \
                -F "chat_id=${chat_id}" \
                -F "photo=@/tmp/gmail_report.png" \
                --form-string "caption=$(cat /tmp/gmail_caption.txt)" 2>&1)
              ok=$(printf '%s' "$response" | python -c 'import json,sys; d=json.load(sys.stdin); print(str(d.get("ok",False)).lower())' 2>/dev/null || printf false)
              delivered_type=$(printf '%s' "$response" | python -c 'import json,sys; d=json.load(sys.stdin); print(d.get("result",{}).get("chat",{}).get("type",""))' 2>/dev/null || true)
              if [ "$ok" = "true" ] && [ "$delivered_type" = "private" ]; then
                message_id=$(printf '%s' "$response" | python -c 'import json,sys; print(json.load(sys.stdin)["result"]["message_id"])')
                state=success
                description="Private Telegram message_id=${message_id}"
                comment="✅ Gmail-отчёт с фотографией и текстом отправлен в личный чат. message_id=${message_id}"
                result=0
              else
                error_text=$(printf '%s' "$response" | python -c 'import json,sys; print(json.load(sys.stdin).get("description","Telegram отклонил сообщение"))' 2>/dev/null || printf 'Telegram отклонил сообщение')
                fail "$error_text"
              fi
            fi
          fi

          description=$(printf '%.130s' "$description")
          jq -n --arg state "$state" --arg context 'gmail-report-private' --arg description "$description" \
            '{state:$state,context:$context,description:$description}' > /tmp/status.json
          curl --silent --show-error --request POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data-binary @/tmp/status.json >/dev/null || true

          jq -n --arg body "$comment" '{body:$body}' > /tmp/comment.json
          curl --silent --show-error --request POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/1/comments" \
            --data-binary @/tmp/comment.json >/dev/null || true

          echo "$comment"
          exit "$result"
