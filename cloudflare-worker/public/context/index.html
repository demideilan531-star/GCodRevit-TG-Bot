<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Контекст Telegram</title>
    <link rel="stylesheet" href="./context.css" />
    <script src="https://telegram.org/js/telegram-web-app.js?61"></script>
    <script src="/sport/vendor/lucide-0.468.0.min.js" defer></script>
    <script src="./context.js" type="module"></script>
  </head>
  <body>
    <div class="app-shell">
      <nav class="product-switch" aria-label="Раздел приложения" style="grid-template-columns: repeat(3, minmax(0, 1fr))">
        <a href="/tasks/">Задачи</a>
        <a class="active" href="/context/">Контекст</a>
        <a href="/sport/">Спорт</a>
      </nav>

      <header class="app-header">
        <div>
          <p class="eyebrow">Telegram</p>
          <h1>Контекст</h1>
        </div>
        <button class="icon-button" id="refreshButton" type="button" aria-label="Обновить" title="Обновить">↻</button>
      </header>
      <p id="demoBanner" class="demo-banner" hidden>ДЕМО · Вымышленные сообщения · Ссылки недействительны</p>

      <section class="status-band" id="statusBand" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <div>
          <strong id="statusTitle">Проверка подключения</strong>
          <span id="statusDetail"></span>
        </div>
      </section>

      <section class="account-band" id="accountPanel" hidden aria-live="polite">
        <div><strong id="accountTitle">Архив аккаунта</strong><p id="accountDetail"></p></div>
        <button class="icon-button" id="accountToggle" type="button" hidden aria-label="Управление синхронизацией" title="Управление синхронизацией"><i data-lucide="pause" aria-hidden="true"></i></button>
      </section>
      <div class="source-switch" id="sourceSwitch" role="group" aria-label="Источник переписки" hidden>
        <button id="streamSource" type="button" aria-pressed="true">Новые сообщения</button>
        <button id="archiveSource" type="button" aria-pressed="false" disabled>Архив аккаунта</button>
      </div>

      <main>
        <section class="controls" aria-label="Параметры выгрузки">
          <label class="field search-field"><span>Поиск чатов</span><input id="chatSearch" type="search" placeholder="Имя или название" autocomplete="off" /></label>
          <label class="field chat-field">
            <span>Чат</span>
            <select id="chatSelect" disabled>
              <option value="">Нет сохранённых чатов</option>
            </select>
          </label>
        </section>
        <button id="moreChatsButton" class="secondary-button page-button" type="button" hidden>Ещё чаты</button>

        <section class="context-heading" aria-labelledby="chatHeading">
          <div>
            <h2 id="chatHeading">Переписка</h2>
            <p id="messageSummary">Сообщений пока нет</p>
          </div>
          <button class="icon-button danger" id="deleteButton" type="button" aria-label="Удалить контекст чата" title="Удалить контекст чата" disabled>⌫</button>
        </section>

        <button id="olderButton" class="secondary-button page-button" type="button" hidden>Более ранние сообщения</button>
        <div class="message-list" id="messageList" aria-live="polite"></div>

        <div class="export-actions">
          <button class="secondary-button" id="copyButton" type="button" disabled>Копировать</button>
          <button class="primary-button" id="downloadButton" type="button" disabled>Скачать .md</button>
          <button class="secondary-button" id="shareButton" type="button" title="Поделиться контекстом по ссылке" disabled><i data-lucide="link" aria-hidden="true"></i>Ссылка</button>
        </div>
      </main>
    </div>

    <dialog id="shareDialog" aria-labelledby="shareTitle">
      <div class="share-heading"><h2 id="shareTitle">Ссылка на контекст</h2><button class="icon-button" id="closeShare" type="button" aria-label="Закрыть" title="Закрыть"><i data-lucide="x" aria-hidden="true"></i></button></div>
      <p id="shareTarget" class="share-target"></p>
      <p id="shareWarning" class="share-warning"></p>
      <form id="shareForm">
        <label class="field"><span>Сообщений по ссылке</span><select id="limitSelect"><option value="20">20</option><option value="50">50</option><option value="100">100</option><option value="200" selected>200</option></select></label>
        <label class="field"><span>Срок доступа</span><select id="shareTtl"><option value="1">1 час</option><option value="24" selected>24 часа</option><option value="168">7 дней</option></select></label>
        <label class="consent-field" id="accountShareConsent" hidden><input id="shareConsent" type="checkbox" />Есть согласие участников на передачу выбранного контекста получателю</label>
        <div class="share-create"><span id="shareStatus" role="status" aria-live="polite"></span><button class="primary-button" id="createShareButton" type="submit">Создать ссылку</button></div>
      </form>
      <div class="share-heading"><h3>Активные ссылки</h3><button class="icon-button" id="shareRetry" type="button" title="Обновить ссылки" aria-label="Обновить ссылки"><i data-lucide="refresh-cw" aria-hidden="true"></i></button></div>
      <p id="shareError" class="share-error" role="alert" hidden></p>
      <div id="shareList" class="share-list"></div>
    </dialog>

    <div class="loading-overlay" id="loadingOverlay" aria-live="polite">
      <span class="spinner"></span>
      <span>Загрузка контекста</span>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
